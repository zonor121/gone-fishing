services:
  - type: web
    name: fishing-game
    runtime: python
    plan: starter
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: DB_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
